<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>블루팝스 전체 상품 · 경쟁사 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Grid: column 1152px, 12 tracks, gap 12 -> 12 x 85 + 11 x 12 = 1152; span 8 = 764, span 4 = 376, 764 + 12 + 376 = 1152. */
:root {
  --ground: #f2f4f7;
  --surface: #ffffff;
  --raised: #eef0f3;
  --border: #e2e5ea;
  --rule: #eef0f3;
  --control: #cfd3da;
  --text: #0a0a0a;
  --muted: #666b73;
  --accent: #141414;
  --hue: #1d5fbf;
  --bar: #b8bec7;
  --track: #d9dde3;
  --radius-card: 8px;
  --radius-control: 6px;
  --gap: 12px;
  --pad: 24px;
  --control-height: 40px;
  --font: "Geist", "Noto Sans KR", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--text);
  font-family: var(--font); font-size: 14px; line-height: 20px;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.u { color: var(--muted); font-size: 13px; font-weight: 400; margin-left: 1px; }
.mono { font-family: var(--mono); font-size: 13px; }
h1, h2 { text-wrap: balance; }
h1, h2, .finding, .kpi .note, .source, .cap, .head .meta, .rows .name, .c-prod .nm { word-break: keep-all; }
.finding, .kpi .note, .source, .cap { text-wrap: pretty; }

.column { max-width: 1152px; margin: 0 auto; padding: 0 20px; }
@media (min-width: 1200px) { .column { padding: 0; } }

.bar { height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; min-width: 0; }
.brand svg { display: block; flex: none; }
.brand .scope { color: var(--muted); font-weight: 400; white-space: nowrap; }
.brand .scope::before { content: "/"; margin-right: 10px; color: var(--control); }
.bar-right { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.bar-right a { text-decoration: none; color: var(--text); }
.bar-right a:hover { text-decoration: underline; }

.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding: 28px 0 20px; }
h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 500; }
.finding { margin: 4px 0 0; font-size: 15px; line-height: 22px; color: var(--muted); max-width: 70ch; }
.finding b { color: var(--text); font-weight: 500; }
.actions { display: flex; gap: 8px; flex: none; }
.btn {
  display: inline-flex; align-items: center; height: var(--control-height); padding: 0 14px;
  border-radius: var(--radius-control); border: 1px solid var(--control); background: var(--surface);
  text-decoration: none; font-size: 14px; cursor: pointer; white-space: nowrap;
  transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), border-color 140ms, background-color 140ms;
}
.btn:hover { border-color: #9aa0a9; }
.btn:active, .tab:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #000; }
@media (prefers-reduced-motion: reduce) { .btn, .tab { transition: none; } .btn:active, .tab:active { transform: none; } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: var(--gap); }
.kpi { padding: 20px var(--pad) 22px; border-left: 1px solid var(--border); min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .label { color: var(--muted); font-size: 14px; }
.kpi .value { margin-top: 6px; font-size: 24px; line-height: 32px; font-weight: 500; }
.kpi .value.money { font-weight: 700; }
.kpi.lead .value { font-size: 36px; line-height: 44px; margin-top: 2px; }
.kpi .note { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 18px; }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); align-items: stretch; }
.span-8 { grid-column: span 8; min-width: 0; }
.span-4 { grid-column: span 4; min-width: 0; }
.span-12 { grid-column: 1 / -1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.stack .card { flex: 1; }

.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 18px var(--pad) 0; }
.head h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.head .meta { color: var(--muted); font-size: 13px; text-align: right; display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.head .meta b { color: var(--text); font-weight: 500; }
.key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart { margin: 4px var(--pad) 0; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font); font-size: 13px; fill: var(--muted); }
.chart text.em { fill: var(--text); font-weight: 500; }
.chart text.hue { fill: var(--hue); font-weight: 500; }
.cap { padding: 6px var(--pad) 20px; color: var(--muted); font-size: 13px; line-height: 18px; }

.col-head { display: flex; gap: 12px; padding: 10px var(--pad) 0; color: var(--muted); font-size: 13px; }
.col-head span:first-child { flex: 1; }
.col-head span:nth-child(2) { min-width: 4ch; text-align: right; }
.col-head span:last-child { width: 92px; text-align: right; }
.rows { list-style: none; margin: 6px 0 0; padding: 0 var(--pad) 16px; }
.rows li { padding: 7px 0 6px; }
.rows .line { display: flex; align-items: baseline; gap: 12px; }
.rows .name { flex: 1; min-width: 0; }
.rows .count { font-weight: 500; min-width: 4ch; text-align: right; }
.rows .aux { width: 92px; text-align: right; color: var(--muted); font-size: 13px; }
.rows .tr { margin-top: 6px; height: 2px; background: var(--rule); border-radius: 1px; }
.rows .tr i { display: block; height: 100%; background: #b6bbc3; border-radius: 1px; }
.rows li.top .tr i { background: var(--text); }
.facts { margin: 0; padding: 4px var(--pad) 20px; }
.facts p { margin: 0; color: var(--muted); font-size: 13px; line-height: 20px; text-wrap: pretty; }
.facts p b { color: var(--text); font-weight: 500; }

.list-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px var(--pad) 0; }
.list-head h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.list-head .count { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools input, .tools select {
  height: var(--control-height); border: 1px solid var(--control); border-radius: var(--radius-control);
  background: var(--surface); padding: 0 12px; font-size: 14px; max-width: 100%;
}
.tools input { width: 220px; }
.tools input::placeholder { color: #6b6f77; }
.tabs {
  display: flex; gap: 20px; margin: 14px var(--pad) 0; padding: 0; border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; background: none; border: 0; padding: 10px 0 12px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), color 140ms;
}
.tab:hover { color: var(--text); }
.tab[aria-pressed="true"] { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
.tab small { font-size: 13px; margin-left: 4px; color: var(--muted); font-weight: 400; }

.table { --cols: minmax(0, 2.2fr) 76px minmax(0, 1.1fr) minmax(0, 1.9fr) 92px 60px 112px; margin: 0 var(--pad); }
.thead, .trow { display: grid; grid-template-columns: var(--cols); column-gap: 16px; align-items: center; }
.thead { height: 40px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; background: var(--surface); }
.thead .r, .trow .r { text-align: right; }
.trows { list-style: none; margin: 0; padding: 0; }
.trow { min-height: 72px; padding: 10px 0; border-top: 1px solid var(--rule); }
.trow:first-child { border-top: 0; }
.c-prod { display: flex; gap: 12px; align-items: center; min-width: 0; }
.c-prod img { width: 40px; height: 52px; object-fit: cover; border-radius: 3px; background: var(--raised); flex: none; outline: 1px solid rgba(0, 0, 0, 0.1); outline-offset: -1px; }
.c-prod .t { min-width: 0; }
.c-prod .nm { display: block; font-weight: 500; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-prod .nm:hover { text-decoration: underline; }
.c-prod .sub { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; padding: 0 6px; margin-right: 6px; border-radius: 4px; background: var(--raised); color: #3d4148; font-size: 12px; line-height: 18px; vertical-align: 1px; }
.tag.hue { background: #e4ecf8; color: #17407f; }
.c-month { color: var(--muted); font-size: 13px; }
.c-color { color: var(--muted); font-size: 13px; line-height: 18px; }
.c-color s, .c-size s { color: #8b9098; }
.c-size { font-size: 13px; line-height: 18px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.c-size span { white-space: nowrap; }
.c-size em { font-style: normal; color: var(--muted); margin-left: 5px; }
.c-size sup { font-size: 12px; color: var(--muted); margin-left: 3px; vertical-align: baseline; }
.c-size .none { color: var(--muted); }
.c-list, .c-rate { color: var(--muted); font-size: 13px; }
.c-sale { font-weight: 700; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 20px; border-top: 1px solid var(--rule); margin: 0 var(--pad); }
.foot .range { color: var(--muted); }
.empty { padding: 32px 0; color: var(--muted); }
.source { color: var(--muted); font-size: 13px; line-height: 18px; margin: 14px 2px 48px; max-width: 90ch; }

@media (max-width: 900px) {
  :root { --control-height: 44px; }
  .span-8, .span-4 { grid-column: 1 / -1; }
  .stack .card { flex: none; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { border-left: 0; border-top: 1px solid var(--border); padding: 16px 16px 18px; }
  .kpi:nth-child(2n) { border-left: 1px solid var(--border); }
  .kpi:nth-child(-n+2) { border-top: 0; }
  .kpi .value { font-size: 20px; line-height: 28px; }
  .kpi.lead .value { font-size: 30px; line-height: 38px; }
  .title-row { flex-direction: column; gap: 16px; padding-top: 20px; }
  .bar-right .hide-s { display: none; }
  .head { flex-direction: column; align-items: flex-start; gap: 2px; padding-left: 16px; padding-right: 16px; }
  .head .meta { text-align: left; justify-content: flex-start; }
  .list-head { padding-left: 16px; padding-right: 16px; }
  .chart { margin-left: 16px; margin-right: 16px; }
  .cap, .facts { padding-left: 16px; padding-right: 16px; }
  .rows, .col-head { padding-left: 16px; padding-right: 16px; }
  .tabs { margin-left: 16px; margin-right: 16px; }
  .tools { width: 100%; }
  .tools input { flex: 1 1 100%; width: auto; min-width: 0; }
  .tools select { flex: 1 1 calc(50% - 4px); min-width: 0; }
  .table { margin: 0 16px; }
  .foot { margin: 0 16px; }
  .thead { display: none; }
  .trow {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "prod sale" "size list" "color color";
    row-gap: 6px; padding: 14px 0;
  }
  .c-prod { grid-area: prod; }
  .c-sale { grid-area: sale; align-self: start; text-align: right; }
  .c-size { grid-area: size; }
  .c-list { grid-area: list; align-self: start; text-align: right; }
  .c-rate, .c-month { display: none; }
  .c-color { grid-area: color; }
  .c-prod .sub { white-space: normal; }
}
</style>
</head>
<body>
<div class="column">
  <header class="bar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="13" width="4" height="7" fill="#0a0a0a"/><rect x="8" y="8" width="4" height="12" fill="#0a0a0a"/><rect x="14" y="3" width="4" height="17" fill="#0a0a0a"/></svg>
      <span>경쟁사 모니터</span><span class="scope">블루팝스</span>
    </div>
    <div class="bar-right"><a href="../bluepops/index.html">BEST 40개 보기</a><span class="hide-s" id="stamp"></span></div>
  </header>

  <div class="title-row">
    <div>
      <h1>블루팝스 전체 상품</h1>
      <p class="finding" id="finding"></p>
    </div>
    <div class="actions">
      <a class="btn" href="https://www.bluepops.co.kr/" target="_blank" rel="noopener">블루팝스에서 보기</a>
      <a class="btn primary" id="csv" href="products.csv" download>CSV 받기</a>
    </div>
  </div>

  <section class="card kpis" id="kpis" aria-label="요약"></section>

  <div class="grid">
    <section class="card span-8" aria-labelledby="price-title">
      <div class="head">
        <h2 id="price-title"></h2>
        <div class="meta" id="price-meta"></div>
      </div>
      <div class="chart" id="price-chart" role="img"></div>
      <p class="cap" id="price-cap"></p>
    </section>

    <section class="card span-4" aria-labelledby="kind-title">
      <div class="head"><h2 id="kind-title">종류별 상품</h2></div>
      <div class="col-head"><span>종류</span><span>개수</span><span>중간 할인가</span></div>
      <ul class="rows" id="kinds"></ul>
    </section>

    <section class="card span-8" aria-labelledby="month-title">
      <div class="head">
        <h2 id="month-title"></h2>
        <div class="meta" id="month-meta"></div>
      </div>
      <div class="chart" id="month-chart" role="img"></div>
      <p class="cap" id="month-cap"></p>
    </section>

    <div class="span-4 stack">
      <section class="card" aria-labelledby="size-title">
        <div class="head"><h2 id="size-title">사이즈 표기 방식</h2></div>
        <div class="col-head"><span>방식</span><span>개수</span><span></span></div>
        <ul class="rows" id="schemes"></ul>
      </section>
      <section class="card" aria-labelledby="stock-title">
        <div class="head"><h2 id="stock-title">품절 현황</h2></div>
        <div class="facts" id="stock"></div>
      </section>
    </div>

    <section class="card span-12" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">상품 목록 <span class="count" id="list-count"></span></h2>
        <div class="tools">
          <input id="q" type="search" placeholder="상품명·코드 검색" aria-label="상품명 또는 코드 검색">
          <select id="f-price" aria-label="가격대"></select>
          <select id="f-flag" aria-label="분류">
            <option value="">모든 분류</option>
            <option value="best">BEST</option>
            <option value="sale">세일 상품</option>
            <option value="own">자체제작</option>
            <option value="today">오늘출발</option>
            <option value="off">품절 옵션 있음</option>
            <option value="alloff">전 옵션 품절</option>
          </select>
          <select id="sort" aria-label="정렬">
            <option value="new">최근 등록순</option>
            <option value="low">할인가 낮은 순</option>
            <option value="high">할인가 높은 순</option>
          </select>
        </div>
      </div>
      <div class="tabs" id="tabs" role="group" aria-label="카테고리"></div>
      <p class="cap" style="padding-bottom:0">사이즈에 줄이 그어져 있으면 모든 조합이 품절입니다. 7/8처럼 숫자가 붙은 사이즈는 색상·기장 조합 중 구매할 수 있는 수입니다.</p>
      <div class="table">
        <div class="thead" aria-hidden="true">
          <span>상품</span><span>등록월</span><span>색상</span><span>선택 가능한 사이즈</span><span class="r">판매가</span><span class="r">할인율</span><span class="r">할인가</span>
        </div>
        <ol class="trows" id="rows"></ol>
      </div>
      <div class="foot">
        <span class="range" id="range"></span>
        <button class="btn" id="more" type="button"></button>
      </div>
    </section>
  </div>

  <p class="source" id="source"></p>
</div>

<script src="data/products.js"></script>
<script>
const BP = window.BP;
const P = BP.products;
const $ = id => document.getElementById(id);
const won = n => Math.round(n).toLocaleString("ko-KR");
const wonU = n => `${won(n)}<span class="u">원</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dash = "–";
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);
const CAT_KO = { Outer: "아우터", Top: "상의", Bottom: "하의", Dress: "원피스", Swimwear: "수영복", "Bag.Shoes": "가방·신발", Acc: "액세서리", Jewellery: "주얼리" };
const CAT_ORDER = Object.keys(CAT_KO);

// ---------- derived numbers (everything on screen comes from the rows) ----------
const N = P.length;
const medF = median(P.map(p => p.f)), medP = median(P.map(p => p.p));
const best = P.filter(p => p.tg.includes("Best"));
const medBest = best.length ? median(best.map(p => p.f)) : 0;
const asOf = BP.asOf;
const monthsAll = [...new Set(P.map(p => p.mo))].sort();
const lastMonth = monthsAll[monthsAll.length - 1];
const addMonths = (ym, k) => { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const recent12From = addMonths(lastMonth, -11);
const recent12 = P.filter(p => p.mo >= recent12From);
const own = P.filter(p => p.own);
const kinds = Object.entries(P.reduce((m, p) => ((m[p.k] ||= []).push(p), m), {})).map(([k, l]) => ({ k, l })).sort((a, b) => b.l.length - a.l.length);
const topKind = kinds[0];
const offProducts = P.filter(p => p.ou > 0);
const allOff = P.filter(p => p.ot && p.ou === p.ot);
const someSizeOff = P.filter(p => p.sz.some(x => x[1] === 0));

console.assert(kinds.reduce((a, x) => a + x.l.length, 0) === N, "kinds sum to total");
console.assert(P.every(p => p.f > 0 && p.p >= p.f), "final price never above list price");
const offOpt = P.reduce((a, p) => a + p.ou, 0), totOpt = P.reduce((a, p) => a + p.ot, 0);
console.assert(P.every(p => p.ot >= p.ou), "sold-out options never exceed options");
console.assert(P.every(p => p.sz.every(x => x[1] <= x[2]) && p.col.every(x => x[1] <= x[2])), "available never exceeds total");

$("stamp").textContent = `${asOf} 수집`;
$("finding").innerHTML =
  `${N.toLocaleString("ko-KR")}개의 절반은 <b>${won(medF)}원</b> 이하이고, ${esc(topKind.k)}가 <b>${pct(topKind.l.length, N)}%</b>를 차지합니다. ` +
  `최근 12개월에 <b>${recent12.length.toLocaleString("ko-KR")}개</b>가 올라왔고, 옵션의 <b>${pct(offOpt, totOpt)}%</b>가 품절입니다.`;

$("kpis").innerHTML = `
  <div class="kpi lead"><div class="label">중간 할인가</div><div class="value money">${won(medF)}<span class="u">원</span></div><div class="note">판매가 중간 ${won(medP)}원 · 쿠폰 적용가 기준</div></div>
  <div class="kpi"><div class="label">전체 상품</div><div class="value">${N.toLocaleString("ko-KR")}<span class="u">개</span></div><div class="note">${kinds.length}개 종류, 가격 ${won(Math.min(...P.map(p => p.f)))}${dash}${won(Math.max(...P.map(p => p.f)))}원</div></div>
  <div class="kpi"><div class="label">최근 12개월 등록</div><div class="value">${recent12.length.toLocaleString("ko-KR")}<span class="u">개</span></div><div class="note">전체의 ${pct(recent12.length, N)}% · ${recent12From.replace("-", ".")}부터</div></div>
  <div class="kpi"><div class="label">품절 옵션</div><div class="value">${pct(offOpt, totOpt)}<span class="u">%</span></div><div class="note">옵션 ${totOpt.toLocaleString("ko-KR")}개 중 ${offOpt.toLocaleString("ko-KR")}개<br>전 옵션 품절 상품 ${allOff.length}개</div></div>`;

// ---------- chart 1: price distribution, all products vs BEST ----------
const BIN = 10000;
const p97 = [...P.map(p => p.f)].sort((a, b) => a - b)[Math.floor(N * 0.97)];
const CAP = Math.max(80000, Math.ceil(p97 / BIN) * BIN);
const NB = CAP / BIN + 1; // last bin is open-ended
const binOf = v => Math.min(NB - 1, Math.floor(v / BIN));
const allCnt = Array(NB).fill(0), bestCnt = Array(NB).fill(0);
P.forEach(p => allCnt[binOf(p.f)]++);
best.forEach(p => bestCnt[binOf(p.f)]++);
const allShare = allCnt.map(c => c / N * 100), bestShare = bestCnt.map(c => (best.length ? c / best.length * 100 : 0));
console.assert(allCnt.reduce((a, b) => a + b, 0) === N, "price bins sum to total");
const modeAll = allCnt.indexOf(Math.max(...allCnt));
const binLabel = i => i === NB - 1 ? `${won(CAP)}원 이상` : `${won(i * BIN)}${dash}${won((i + 1) * BIN - 1)}원`;
const bestUnder = best.filter(p => p.f < 30000).length, allUnder = P.filter(p => p.f < 30000).length;
$("price-title").textContent = best.length
  ? `BEST는 3만원 미만이 ${pct(bestUnder, best.length)}%, 전체 상품은 ${pct(allUnder, N)}%입니다`
  : `${binLabel(modeAll)} 구간에 ${allCnt[modeAll]}개가 몰려 있습니다`;
$("price-meta").innerHTML = `<span class="key"><i style="background:var(--bar)"></i>전체 ${N.toLocaleString("ko-KR")}개</span><span class="key"><i style="background:var(--hue)"></i>BEST ${best.length}개</span>`;
$("price-cap").textContent = `1만원 단위로 묶은 쿠폰 적용가별 상품 비중(%)입니다. 가장 많은 구간은 ${binLabel(modeAll)}(${allCnt[modeAll]}개), BEST의 중간값은 ${won(medBest)}원입니다.`;
$("price-chart").setAttribute("aria-label",
  `가격대별 상품 비중. 전체 중간 할인가 ${won(medF)}원, BEST 중간 할인가 ${won(medBest)}원. 3만원 미만은 전체 ${pct(allUnder, N)}%, BEST ${pct(bestUnder, best.length)}%.`);

function niceMax(v) {
  const step = v <= 20 ? 5 : v <= 40 ? 10 : 20;
  let m = Math.ceil(v / step) * step; if (m === v) m += step;
  return { max: m, step };
}
function drawPrice() {
  const el = $("price-chart"), W = el.clientWidth, mobile = W < 520;
  const L = 40, R = 6, T = 40, B = 34, H = mobile ? 210 : 270;
  const { max, step } = niceMax(Math.max(...allShare, ...bestShare));
  const bw = (W - L - R) / NB, plotH = H;
  const y = v => T + plotH - v / max * plotH;
  let s = `<svg width="${W}" height="${T + plotH + B}" aria-hidden="true">`;
  for (let t = 0; t <= max; t += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(t) + .5}" y2="${y(t) + .5}" stroke="${t === 0 ? "#c9ced6" : "#e8ebef"}"/>`;
    s += `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  }
  s += `<text x="0" y="${T - 14}">비중(%)</text>`;
  const gap = 3, barW = Math.max(3, (bw - gap * 2) / 2);
  for (let i = 0; i < NB; i++) {
    const x0 = L + i * bw + gap;
    const ha = allShare[i] / max * plotH, hb = bestShare[i] / max * plotH;
    s += `<rect x="${x0}" y="${y(allShare[i])}" width="${barW}" height="${ha}" fill="#b8bec7"/>`;
    if (best.length) s += `<rect x="${x0 + barW}" y="${y(bestShare[i])}" width="${barW}" height="${hb}" fill="#1d5fbf"/>`;
  }
  const hiBest = bestShare.indexOf(Math.max(...bestShare));
  s += `<text class="em" x="${L + modeAll * bw + gap + barW / 2}" y="${y(allShare[modeAll]) - 6}" text-anchor="middle">${Math.round(allShare[modeAll])}%</text>`;
  if (best.length) s += `<text class="hue" x="${L + hiBest * bw + gap + barW * 1.5}" y="${y(bestShare[hiBest]) - 6}" text-anchor="middle">${Math.round(bestShare[hiBest])}%</text>`;
  for (let i = 0; i < NB; i += 2) {
    const lbl = i === NB - 1 ? `${CAP / 10000}만원+` : i === 0 ? "0" : `${i}만원`;
    s += `<text x="${L + i * bw}" y="${T + plotH + 22}" text-anchor="middle">${lbl}</text>`;
  }
  const mx = v => L + Math.min(v, CAP) / BIN * bw;
  const ref = (v, label, color, row, cls) => {
    const x = mx(v), right = x > W - 150;
    return `<line x1="${x}" x2="${x}" y1="${T - 12 + row * 0}" y2="${T + plotH}" stroke="${color}" stroke-dasharray="3 3"/>` +
      `<text class="${cls}" x="${right ? x - 6 : x + 6}" y="${T - 22 + row * 16}" text-anchor="${right ? "end" : "start"}">${label}</text>`;
  };
  s += ref(medF, `전체 중간 ${won(medF)}원`, "#8d939c", 0, "");
  if (best.length) s += ref(medBest, `BEST 중간 ${won(medBest)}원`, "#1d5fbf", 1, "hue");
  el.innerHTML = s + "</svg>";
}

// ---------- chart 2: registrations per month ----------
const SPAN = 24;
const monthList = Array.from({ length: SPAN }, (_, i) => addMonths(lastMonth, i - (SPAN - 1)));
const monthCnt = monthList.map(m => P.filter(p => p.mo === m).length);
const olderCnt = P.filter(p => p.mo < monthList[0]).length;
const peakIdx = monthCnt.indexOf(Math.max(...monthCnt));
$("month-title").textContent = `${monthList[peakIdx].replace("-", ".")}에 ${monthCnt[peakIdx]}개로 가장 많이 올라왔습니다`;
$("month-meta").innerHTML = `<span class="key"><i style="background:var(--hue)"></i>최근 12개월</span><span class="key"><i style="background:var(--bar)"></i>그 이전</span>`;
const estN = P.filter(p => p.me).length;
$("month-cap").textContent = `대표 이미지가 올라온 달을 기준으로 센 월별 상품 수입니다. ${monthList[0].replace("-", ".")} 이전에 올라온 ${olderCnt.toLocaleString("ko-KR")}개는 그래프에 넣지 않았습니다.`;
$("month-chart").setAttribute("aria-label",
  `월별 등록 상품 수. 최근 24개월 중 ${monthList[peakIdx]}에 ${monthCnt[peakIdx]}개로 가장 많고, 최근 12개월에는 ${recent12.length}개가 올라왔습니다.`);
function drawMonths() {
  const el = $("month-chart"), W = el.clientWidth, mobile = W < 520;
  const L = 40, R = 6, T = 22, B = 34, H = mobile ? 190 : 330;
  const { max, step } = niceMax(Math.max(...monthCnt));
  const bw = (W - L - R) / SPAN, y = v => T + H - v / max * H;
  let s = `<svg width="${W}" height="${T + H + B}" aria-hidden="true">`;
  for (let t = 0; t <= max; t += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(t) + .5}" y2="${y(t) + .5}" stroke="${t === 0 ? "#c9ced6" : "#e8ebef"}"/>`;
    s += `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  }
  s += `<text x="0" y="${T - 10}">개</text>`;
  monthCnt.forEach((c, i) => {
    const recent = monthList[i] >= recent12From;
    const w = Math.max(3, bw - 4);
    s += `<rect x="${L + i * bw + 2}" y="${y(c)}" width="${w}" height="${Math.max(0, c / max * H)}" fill="${recent ? "#1d5fbf" : "#b8bec7"}"><title>${monthList[i]} ${c}개</title></rect>`;
  });
  s += `<text class="${monthList[peakIdx] >= recent12From ? "hue" : "em"}" x="${L + peakIdx * bw + bw / 2}" y="${y(monthCnt[peakIdx]) - 6}" text-anchor="middle">${monthCnt[peakIdx]}</text>`;
  const every = mobile ? 6 : 3;
  monthList.forEach((m, i) => {
    if ((SPAN - 1 - i) % every === 0) s += `<text x="${L + i * bw + bw / 2}" y="${T + H + 22}" text-anchor="middle">${m.slice(2).replace("-", ".")}</text>`;
  });
  el.innerHTML = s + "</svg>";
}

// ---------- side lists ----------
function barList(el, rows, maxV, fmtAux) {
  el.innerHTML = rows.map((r, i) => `
    <li class="${i === 0 ? "top" : ""}"><div class="line"><span class="name">${esc(r.name)}</span><span class="count">${r.n.toLocaleString("ko-KR")}</span><span class="aux">${fmtAux ? fmtAux(r) : ""}</span></div>
    <div class="tr"><i style="width:${(r.n / maxV * 100).toFixed(1)}%"></i></div></li>`).join("");
}
const kindRows = kinds.slice(0, 8).map(x => ({ name: x.k, n: x.l.length, med: median(x.l.map(p => p.f)) }));
const restKinds = kinds.slice(8);
if (restKinds.length) {
  const rl = restKinds.flatMap(x => x.l);
  kindRows.push({ name: `그 외 ${restKinds.length}종`, n: rl.length, med: median(rl.map(p => p.f)) });
}
barList($("kinds"), kindRows, kindRows[0].n, r => wonU(r.med));

const schemeOrder = ["2사이즈(1·2)", "프리(F)", "신발 mm", "S–XL(알파벳)", "번호 3단계+", "표기 없음", "기타", "단일"];
const schemeCnt = Object.entries(P.reduce((m, p) => (m[p.s] = (m[p.s] || 0) + 1, m), {})).map(([name, n]) => ({ name, n })).sort((a, b) => b.n - a.n);
console.assert(schemeCnt.reduce((a, x) => a + x.n, 0) === N, "scheme groups sum to total");
const schemeRows = schemeCnt.slice(0, 5);
const schemeRest = schemeCnt.slice(5);
if (schemeRest.length) schemeRows.push({ name: `그 외 ${schemeRest.map(x => x.name).join("·")}`, n: schemeRest.reduce((a, x) => a + x.n, 0) });
barList($("schemes"), schemeRows, schemeCnt[0].n, null);

$("stock").innerHTML = `
  <p><b>${offProducts.length.toLocaleString("ko-KR")}개 상품(${pct(offProducts.length, N)}%)</b>에 품절 옵션이 있습니다. 옵션 ${totOpt.toLocaleString("ko-KR")}개 중 ${offOpt.toLocaleString("ko-KR")}개(${pct(offOpt, totOpt)}%)가 품절입니다.</p>
  <p style="margin-top:8px"><b>${allOff.length}개</b>는 모든 옵션이 품절이고, <b>${someSizeOff.length}개</b>는 사이즈 하나 이상이 모든 색상에서 품절입니다. 목록에서는 줄을 그어 표시합니다.</p>`;

// ---------- catalog ----------
const state = { cat: "전체", q: "", price: "", flag: "", sort: "new", shown: 40 };
const PAGE = 40;
const PRICE_BANDS = [["", "모든 가격대"], ["0-20000", "2만원 미만"], ["20000-30000", "2만~3만원"], ["30000-50000", "3만~5만원"], ["50000-80000", "5만~8만원"], ["80000-9999999", "8만원 이상"]];
$("f-price").innerHTML = PRICE_BANDS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");

function sizeCell(p) {
  const fmt = s => { const m = s.match(/^(.+?)\((.+)\)$/); return m ? [m[1], m[2].replace("-", dash)] : [s, ""]; };
  const all = p.sz.map(([label, a, t]) => {
    const [x, y] = fmt(label), inner = `${esc(x)}${y ? `<em>${esc(y)}</em>` : ""}`;
    if (a === 0) return `<span title="모든 조합 품절"><s>${inner}</s></span>`;
    if (a < t) return `<span title="조합 ${t}개 중 ${a}개 구매 가능">${inner}<sup>${a}/${t}</sup></span>`;
    return `<span>${inner}</span>`;
  });
  if (!all.length) return p.br ? `<span class="none">${esc(p.br.replace(/-/g, dash))}</span>` : `<span class="none">표기 없음</span>`;
  if (p.ex.length) all.push(`<span class="none">${esc(p.ex.join("/"))}</span>`);
  return all.join("");
}
function colorCell(p) {
  if (!p.col.length) return "–";
  const shown = p.col.slice(0, 4).map(([c, a]) => (a === 0 ? `<s title="품절">${esc(c)}</s>` : esc(c))).join(", ");
  return shown + (p.col.length > 4 ? ` 외 ${p.col.length - 4}` : "");
}
function rowHtml(p) {
  const isBest = p.tg.includes("Best"), isSale = p.d === 1 || p.tg.includes("Sale") || p.tg.includes("Limited Sale");
  const tags = (isBest ? '<span class="tag hue">BEST</span>' : "") + (p.d ? '<span class="tag">세일</span>' : "") + (p.td ? '<span class="tag">오늘출발</span>' : "");
  return `<li class="trow">
    <div class="c-prod"><img src="images/${p.i}" alt="" width="40" height="52" loading="lazy" decoding="async">
      <div class="t"><a class="nm" href="https://www.bluepops.co.kr/product/detail.html?product_no=${p.n}" target="_blank" rel="noopener">${esc(p.t)}</a>
      <div class="sub">${tags}${esc(p.k)}${p.c ? ` · <span class="mono">${esc(p.c)}</span>` : ""}</div></div></div>
    <div class="c-month">${p.mo.replace("-", ".")}${p.me ? "*" : ""}</div>
    <div class="c-color">${colorCell(p)}</div>
    <div class="c-size">${sizeCell(p)}</div>
    <div class="c-list r">${wonU(p.p)}</div>
    <div class="c-rate r">${p.r}%</div>
    <div class="c-sale r">${wonU(p.f)}</div>
  </li>`;
}
function matches(p) {
  if (state.cat !== "전체" && !p.g.includes(state.cat)) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!p.t.toLowerCase().includes(q) && !p.c.toLowerCase().includes(q)) return false; }
  if (state.price) { const [a, b] = state.price.split("-").map(Number); if (p.f < a || p.f >= b) return false; }
  switch (state.flag) {
    case "best": return p.tg.includes("Best");
    case "sale": return p.d === 1 || p.tg.includes("Sale") || p.tg.includes("Limited Sale");
    case "own": return !!p.own;
    case "today": return !!p.td;
    case "off": return p.ou > 0;
    case "alloff": return p.ot > 0 && p.ou === p.ot;
  }
  return true;
}
function view() {
  let list = P.filter(matches);
  if (state.sort === "low") list = [...list].sort((a, b) => a.f - b.f || b.n - a.n);
  if (state.sort === "high") list = [...list].sort((a, b) => b.f - a.f || b.n - a.n);
  return list;
}
function renderTabs() {
  const cnt = c => P.filter(p => p.g.includes(c)).length;
  const items = [["전체", "전체", N], ...CAT_ORDER.filter(c => cnt(c)).map(c => [c, CAT_KO[c], cnt(c)])];
  $("tabs").innerHTML = items.map(([key, label, n]) =>
    `<button class="tab" type="button" data-cat="${key}" aria-pressed="${state.cat === key}">${label}<small>${n.toLocaleString("ko-KR")}</small></button>`).join("");
}
function renderList() {
  const list = view(), shown = list.slice(0, state.shown);
  $("list-count").textContent = `${list.length.toLocaleString("ko-KR")}개`;
  $("rows").innerHTML = shown.length ? shown.map(rowHtml).join("") : `<li class="empty">조건에 맞는 상품이 없습니다. 검색어를 지우거나 필터를 바꿔 보세요.</li>`;
  $("range").textContent = list.length ? `${shown.length.toLocaleString("ko-KR")} / ${list.length.toLocaleString("ko-KR")}개 표시` : "";
  const left = list.length - shown.length;
  $("more").hidden = left <= 0;
  $("more").textContent = `${Math.min(PAGE, left)}개 더 보기`;
}
const reset = () => { state.shown = PAGE; renderList(); };
$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-cat]"); if (!b) return; state.cat = b.dataset.cat; renderTabs(); reset(); });
$("q").addEventListener("input", e => { state.q = e.target.value.trim(); reset(); });
$("f-price").addEventListener("change", e => { state.price = e.target.value; reset(); });
$("f-flag").addEventListener("change", e => { state.flag = e.target.value; reset(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; reset(); });
$("more").addEventListener("click", () => { state.shown += PAGE; renderList(); });

$("source").textContent =
  `출처: bluepops.co.kr 전체 카테고리, ${asOf} 수집. 할인가는 사이트에 표시된 쿠폰 적용가입니다. 사이즈와 색상은 옵션 단위 판매 상태를 기준으로 했고, 재고 수량은 사이트가 공개하지 않아 알 수 없습니다. ` +
  `등록월은 대표 이미지가 올라온 달이며, 이미지 경로에 날짜가 없는 ${estN}개(*)는 상품 번호로 추정했습니다.`;

renderTabs(); renderList();
function drawAll() { drawPrice(); drawMonths(); }
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawAll, 80); });
drawAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAll);
</script>
</body>
</html>
