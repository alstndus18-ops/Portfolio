<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>비슷한 옷 찾기</title>
<style>
  :root { --bg:#f5f6f8; --surface:#fff; --ink:#111318; --sub:#6a7079; --line:#e3e6eb; --acc:#1d5fbf; --acc-soft:#e8f0fc; --radius:12px; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; font-size:14px; line-height:1.45; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 24px; }

  /* 상단 */
  .top { position:sticky; top:0; z-index:5; background:rgba(245,246,248,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top-in { display:flex; align-items:center; gap:12px; padding:12px 0; }
  .brand { font-size:16px; font-weight:700; white-space:nowrap; margin:0; }
  .brand small { color:var(--sub); font-weight:400; margin-left:8px; font-size:12px; }
  .search { flex:1; position:relative; max-width:560px; }
  .search input { width:100%; height:42px; padding:0 14px 0 40px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:15px; }
  .search svg { position:absolute; left:14px; top:12px; color:var(--sub); }
  .btn { height:42px; padding:0 16px; border:1px solid var(--line); background:var(--surface); border-radius:999px; font-weight:600; }
  .btn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .filters { display:none; padding:0 0 12px; gap:20px; flex-wrap:wrap; }
  .filters.on { display:flex; }
  .filters .grp { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .filters .grp > b { font-size:12px; color:var(--sub); font-weight:600; margin-right:4px; }
  .chip { height:32px; padding:0 12px; border:1px solid var(--line); background:var(--surface); border-radius:999px; font-size:13px; display:inline-flex; align-items:center; }
  .chip.on { background:var(--acc-soft); border-color:var(--acc); color:var(--acc); font-weight:600; }

  /* 가격 */
  .pf { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 16px 10px; }
  .pf-h { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:6px; }
  .pf-h b { font-size:13px; }
  .pf-h .rng { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .pf-h .rng small { color:var(--sub); font-weight:400; font-size:12px; margin-left:6px; }
  .hist { display:flex; align-items:flex-end; gap:2px; height:54px; }
  .hist i { flex:1; background:#d3d8df; border-radius:2px 2px 0 0; min-height:2px; transition:background .12s; }
  .hist i.on { background:var(--acc); }
  .rs { position:relative; height:26px; margin-top:2px; }
  .rs input { position:absolute; left:0; width:100%; top:0; margin:0; height:26px; background:none; pointer-events:none; -webkit-appearance:none; appearance:none; }
  .rs input::-webkit-slider-runnable-track { height:4px; background:transparent; }
  .rs input::-moz-range-track { height:4px; background:transparent; }
  .rs input::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:22px; height:22px; margin-top:-9px; border-radius:50%; background:#fff; border:2px solid var(--acc); box-shadow:0 1px 4px rgba(0,0,0,.2); cursor:grab; }
  .rs input::-moz-range-thumb { pointer-events:auto; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--acc); box-shadow:0 1px 4px rgba(0,0,0,.2); cursor:grab; }
  .rs .line { position:absolute; left:0; right:0; top:11px; height:4px; background:#d3d8df; border-radius:2px; }
  .rs .line i { position:absolute; top:0; bottom:0; background:var(--acc); border-radius:2px; }

  /* 목록 */
  main { padding:18px 0 60px; }
  .tool { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
  .tool .sp { flex:1; }
  .tool select { height:34px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:0 10px; }
  .sub { color:var(--sub); font-size:13px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .tag { background:var(--acc-soft); color:var(--acc); border-radius:6px; padding:2px 9px; font-size:12px; font-weight:600; }
  h2.sec { font-size:16px; margin:22px 0 10px; }
  h2.sec small { color:var(--sub); font-weight:400; font-size:13px; margin-left:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:16px 14px; }
  .card { background:transparent; cursor:pointer; min-width:0; }
  .card .ph { position:relative; border-radius:var(--radius); overflow:hidden; background:#e9ebef; aspect-ratio:3/4; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s; }
  .card:hover img { transform:scale(1.03); }
  .bd { position:absolute; left:8px; top:8px; background:rgba(17,19,24,.72); color:#fff; font-size:11px; border-radius:6px; padding:2px 7px; }
  .card .nm { margin-top:8px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .row { display:flex; justify-content:space-between; gap:6px; align-items:baseline; }
  .card .row b { font-size:15px; font-variant-numeric:tabular-nums; }
  .card .row span { font-size:12px; color:var(--sub); white-space:nowrap; }
  .dots { display:flex; gap:4px; margin-top:5px; min-height:12px; }
  .dot { width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,.16); flex:none; }
  .dot.so { opacity:.35; }
  .more { margin:18px auto 0; display:block; height:40px; padding:0 22px; border:1px solid var(--line); background:var(--surface); border-radius:999px; font-weight:600; }
  .empty { padding:56px 0; text-align:center; color:var(--sub); }
  .empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }

  /* 상세 */
  #panel { position:fixed; inset:0; background:rgba(17,19,24,.5); display:none; z-index:20; }
  #panel.on { display:block; }
  .sheet { position:absolute; right:0; top:0; bottom:0; width:min(1080px,100%); background:var(--bg); overflow:auto; padding:22px 28px 56px; }
  .x { position:sticky; top:0; float:right; z-index:2; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:18px; line-height:1; }
  .dt { display:grid; grid-template-columns:minmax(0,340px) 1fr; gap:28px; margin-bottom:22px; }
  .dt .photo { position:relative; border-radius:16px; overflow:hidden; background:#e9ebef; aspect-ratio:3/4; }
  .dt .photo img { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .15s; }
  .dt .photo img.fade { opacity:.25; }
  .dt .mall { color:var(--sub); font-size:13px; }
  .dt h2 { margin:2px 0 8px; font-size:22px; line-height:1.3; }
  .dt .price { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; }
  .dt .price s { color:var(--sub); font-weight:400; font-size:14px; margin-left:8px; }
  .lab { margin:20px 0 8px; font-size:12px; font-weight:700; color:var(--sub); letter-spacing:.02em; }
  .sw { display:flex; flex-wrap:wrap; gap:8px; }
  .sw button { display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 14px 0 10px; border:1px solid var(--line); background:var(--surface); border-radius:999px; font-size:14px; }
  .sw button .dot { width:20px; height:20px; }
  .sw button.on { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc-soft); font-weight:700; }
  .sw button.so { color:#9aa0a8; text-decoration:line-through; }
  .szs { display:flex; flex-wrap:wrap; gap:6px; }
  .szs span { border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:3px 10px; font-size:13px; }
  .szs span.so { color:#aab0b8; text-decoration:line-through; background:transparent; }
  .go { display:inline-flex; align-items:center; height:44px; padding:0 22px; margin-top:22px; background:var(--ink); color:#fff; border-radius:999px; font-weight:700; text-decoration:none; }
  .sim-h { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:6px 0 12px; }
  .sim-h h3 { margin:0; font-size:18px; }
  .sim-h .sp { flex:1; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface); }
  .seg button { border:0; background:none; height:34px; padding:0 14px; font-size:13px; }
  .seg button.on { background:var(--ink); color:#fff; }
  .tch { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
  .sim .grid { margin-top:14px; }

  @media (max-width:760px) {
    .wrap { padding:0 16px; }
    .brand small { display:none; }
    .sheet { padding:16px 16px 48px; }
    .dt { grid-template-columns:1fr; gap:16px; }
    .dt .photo { max-width:360px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px 10px; }
  }
  @media (prefers-reduced-motion:reduce) { .card img, .hist i, .dt .photo img { transition:none; } }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="top-in">
    <h1 class="brand">비슷한 옷 찾기<small id="meta"></small></h1>
    <label class="search"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
      <input id="q" type="search" placeholder="색과 종류로 검색 (예: 카키 니트)" autocomplete="off" aria-label="검색"></label>
    <button class="btn" id="fbtn" aria-expanded="false">필터</button>
  </div>
  <div class="filters" id="filters"></div>
</div></div>
<main class="wrap">
  <div id="pfMain" class="pf" hidden></div>
  <div id="main"></div>
</main>
<div id="panel" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<script src="data.js"></script>
<script>
const D = window.SS, P = D.products, L = D.labels, PAL = D.palette;
const EXAMPLES = ["초록 상의", "카키 니트", "검정 니트", "스트라이프 셔츠", "베이지 가디건"];
const STOP = ["상의", "옷", "찾아줘", "찾기", "비슷한", "느낌", "계열", "색", "컬러", "스타일", "제품", "상품"];
const $ = id => document.getElementById(id);
const won = n => n == null ? "" : n.toLocaleString("ko-KR") + "원";
const lbl = (g, k) => L[g].values[k] || k;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const price = p => p.sale || p.price;
const mainCols = p => (p.col || []).filter((c, i) => i === 0 || c.share >= 0.3).slice(0, 2);
const has = (p, g, k) => +(p.tags[g] || []).includes(k);
P.forEach((p, i) => { p.i = i; });
const typeOf = p => p.tags.type[0];
const DG = ["detail", "material", "sleeve", "neck", "fit", "pattern"];
const tagsOf = p => p._t || (p._t = DG.flatMap(g => (p.tags[g] || []).map(k => g + ":" + k)));
const tagName = t => { const [g, k] = t.split(":"); return lbl(g, k); };

// CIEDE2000 색 차이. 2 이하는 거의 같음, 5 넘으면 다른 색으로 보임
function dE00(x, y) {
  const [L1, a1, b1] = x, [L2, a2, b2] = y, R = Math.PI / 180;
  const C1 = Math.hypot(a1, b1), C2 = Math.hypot(a2, b2), Cm = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Cm ** 7 / (Cm ** 7 + 25 ** 7)));
  const A1 = a1 * (1 + G), A2 = a2 * (1 + G);
  const c1 = Math.hypot(A1, b1), c2 = Math.hypot(A2, b2);
  const h1 = (Math.atan2(b1, A1) / R + 360) % 360, h2 = (Math.atan2(b2, A2) / R + 360) % 360;
  let dh = h2 - h1;
  if (c1 * c2 === 0) dh = 0; else if (dh > 180) dh -= 360; else if (dh < -180) dh += 360;
  const dL = L2 - L1, dC = c2 - c1, dH = 2 * Math.sqrt(c1 * c2) * Math.sin(dh / 2 * R);
  const Lm = (L1 + L2) / 2, cm = (c1 + c2) / 2;
  let hm = h1 + h2;
  if (c1 * c2 !== 0) hm = Math.abs(h1 - h2) > 180 ? (h1 + h2 + (h1 + h2 < 360 ? 360 : -360)) / 2 : (h1 + h2) / 2;
  const T = 1 - 0.17 * Math.cos((hm - 30) * R) + 0.24 * Math.cos(2 * hm * R) + 0.32 * Math.cos((3 * hm + 6) * R) - 0.2 * Math.cos((4 * hm - 63) * R);
  const SL = 1 + 0.015 * (Lm - 50) ** 2 / Math.sqrt(20 + (Lm - 50) ** 2), SC = 1 + 0.045 * cm, SH = 1 + 0.015 * cm * T;
  const RT = -2 * Math.sqrt(cm ** 7 / (cm ** 7 + 25 ** 7)) * Math.sin(60 * Math.exp(-(((hm - 275) / 25) ** 2)) * R);
  return Math.sqrt((dL / SL) ** 2 + (dC / SC) ** 2 + (dH / SH) ** 2 + RT * (dC / SC) * (dH / SH));
}

// ---------- 색 ----------
// 상품의 색 = 구매 옵션 색. 옵션 색이 없으면 사진 속 색으로 대신한다.
const colsOf = p => p._c || (p._c = p.colorSrc === "옵션" ? p.opts.filter(o => o.lab)
  : mainCols(p).map(c => ({ name: c.name, pal: c.name, lab: c.lab, hex: c.hex, fam: c.fam, fromPhoto: true })));
const SAME_DE = 6;
const sameColor = (c, o) => o.pal === c.pal || dE00(o.lab, c.lab) <= SAME_DE;
// 두 상품이 같은 색 옵션을 공유하는가. a의 색 중 겹치는 것을 돌려준다.
const shared = (a, b) => { const cb = colsOf(b); return colsOf(a).filter(c => cb.some(o => sameColor(c, o))); };
// 옵션 색을 보여줄 사진. label·match(그 색 사진) → lineup(여러 색이 함께 보이는 사진) → representative(대표 사진, 그 색인지 확인 안 됨).
// data.js의 ev가 있으면 그 값을, 없으면 사진 파일로 정한다. tools/color_photos.py evidence_of와 같은 순서.
const evOf = (p, o) => (o && o.ev) || (o && o.img ? "label" : p.lineup ? "lineup" : "representative");
const photoOf = (p, o) => o && o.img ? { img: o.img, ev: evOf(p, o) } : o && p.lineup ? { img: p.lineup, ev: "lineup" } : { img: p.img, ev: "representative" };
const BADGE = { lineup: "여러 색", representative: "대표 사진" };
// 찾는 색(cols)을 가진 옵션의 사진. 같은 색 옵션이 없으면 null.
const shotFor = (p, cols) => {
  if (!(cols || []).length) return null;
  const hit = p.opts.filter(o => o.lab && cols.some(c => sameColor(c, o)));
  if (!hit.length) return null;
  const withImg = hit.find(o => o.img) || hit[0];
  return photoOf(p, withImg);
};

// ---------- 상태·필터 ----------
const malls = [...new Set(P.map(p => p.mall))];
const mallOn = new Set(malls), sizeOn = new Set();
const okSize = p => !sizeOn.size || p.sizeKeys.some(k => sizeOn.has(k));
const visible = p => mallOn.has(p.mall) && okSize(p);
const main = { lo: null, hi: null, sort: "rec", limit: 48 };
const view = { p: null, ref: null, scope: "same", sort: "sim", sameMall: false, otherType: false, sel: new Set(), lo: null, hi: null, limit: 12 };
$("meta").textContent = `상의 ${P.length}개 · ${malls.length}개 몰`;

$("filters").innerHTML =
  `<div class="grp"><b>쇼핑몰</b>${malls.map(m => `<button class="chip on" data-m="${esc(m)}">${esc(m)}</button>`).join("")}</div>` +
  `<div class="grp"><b>사이즈</b>${D.sizeOrder.filter(k => P.some(p => p.sizeKeys.includes(k))).map(k => `<button class="chip" data-z="${esc(k)}">${esc(k)}</button>`).join("")}</div>`;
$("fbtn").onclick = () => { const on = $("filters").classList.toggle("on"); $("fbtn").classList.toggle("on", on); $("fbtn").setAttribute("aria-expanded", on); };
$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.m) { mallOn.has(b.dataset.m) ? mallOn.delete(b.dataset.m) : mallOn.add(b.dataset.m); b.classList.toggle("on"); }
  else { sizeOn.has(b.dataset.z) ? sizeOn.delete(b.dataset.z) : sizeOn.add(b.dataset.z); b.classList.toggle("on"); }
  render(); if (view.p && $("panel").classList.contains("on")) drawSimilar(true);
});
const q = $("q");
q.addEventListener("input", () => { clearTimeout(q._t); q._t = setTimeout(render, 160); });
q.addEventListener("keydown", e => { if (e.key === "Enter") render(); });

// ---------- 가격 분포와 범위 조절 ----------
const BINS = 28, STEP = 1000;
const fmtP = n => "₩" + n.toLocaleString("ko-KR");
// el에 가격 분포 막대와 최소·최대 슬라이더를 그린다. prices는 가격 필터를 걸기 전 후보의 가격. st={lo,hi}는 처음엔 전체 범위.
// onChange(st)는 슬라이더를 움직일 때마다 불리고, 보여 줄 개수를 돌려주면 옆에 적는다.
function mountPrice(el, prices, st, onChange) {
  if (prices.length < 2) { el.hidden = true; el.innerHTML = ""; st.lo = st.hi = null; return; }
  const min = Math.floor(Math.min(...prices) / STEP) * STEP, max = Math.max(min + STEP, Math.ceil(Math.max(...prices) / STEP) * STEP);
  st.lo = min; st.hi = max; el.hidden = false;
  const bins = new Array(BINS).fill(0);
  prices.forEach(v => { bins[Math.min(BINS - 1, Math.floor((v - min) / (max - min) * BINS))]++; });
  const top = Math.max(...bins);
  el.innerHTML = `<div class="pf-h"><b>가격</b><span class="rng"><span class="t"></span><small class="n"></small></span></div>
    <div class="hist">${bins.map(c => `<i style="height:${Math.max(4, c / top * 100)}%"></i>`).join("")}</div>
    <div class="rs"><div class="line"><i></i></div>
      <input type="range" class="lo" min="${min}" max="${max}" step="${STEP}" value="${min}" aria-label="최저 가격">
      <input type="range" class="hi" min="${min}" max="${max}" step="${STEP}" value="${max}" aria-label="최고 가격"></div>`;
  const lo = el.querySelector(".lo"), hi = el.querySelector(".hi"), bars = [...el.querySelectorAll(".hist i")], fill = el.querySelector(".line i");
  const update = () => {
    let a = +lo.value, b = +hi.value;
    if (a > b) { if (document.activeElement === lo) { a = b; lo.value = a; } else { b = a; hi.value = b; } }
    st.lo = a; st.hi = b;
    bars.forEach((x, i) => x.classList.toggle("on", min + (i + 1) / BINS * (max - min) > a && min + i / BINS * (max - min) < b));
    fill.style.left = (a - min) / (max - min) * 100 + "%"; fill.style.right = (1 - (b - min) / (max - min)) * 100 + "%";
    el.querySelector(".t").textContent = `${fmtP(a)} – ${fmtP(b)}`;
    const n = onChange(st);
    el.querySelector(".n").textContent = n == null ? "" : `${n}개`;
  };
  lo.addEventListener("input", update); hi.addEventListener("input", update);
  update();
}
const inRange = (st, p) => st.lo == null || (price(p) >= st.lo && price(p) <= st.hi);
const sorter = k => k === "low" ? (a, b) => price(a.p || a.x) - price(b.p || b.x) : k === "high" ? (a, b) => price(b.p || b.x) - price(a.p || a.x) : null;

// ---------- 카드 ----------
function card(p, shot) {
  const s = shot || { img: p.img, ev: "" };
  const dots = (p.colorSrc === "옵션" ? p.opts : colsOf(p)).filter(o => o.hex).slice(0, 7).map(o => `<i class="dot${o.soldout ? " so" : ""}" style="background:${o.hex}" title="${esc(o.name)}"></i>`).join("");
  return `<div class="card" data-i="${p.i}"><div class="ph"><img loading="lazy" src="${esc(s.img)}" alt="${esc(p.name)}">${BADGE[s.ev] && shot ? `<span class="bd">${BADGE[s.ev]}</span>` : ""}</div>
    <div class="nm">${esc(p.name)}</div><div class="row"><b>${won(price(p))}</b><span>${esc(p.mall)}</span></div><div class="dots">${dots}</div></div>`;
}
function gridHTML(items, limit) {
  return `<div class="grid">${items.slice(0, limit).map(x => x.html).join("")}</div>` +
    (items.length > limit ? `<button class="more" data-more="${limit}">더 보기 (${items.length - limit}개)</button>` : "");
}

// ---------- 검색 ----------
function parse(text) {
  const out = {}; let rest = text.toLowerCase();
  for (const [g, d] of Object.entries(D.dict)) {
    let r = text.toLowerCase();
    const words = Object.entries(d).flatMap(([k, ws]) => ws.map(w => [w, k])).sort((a, b) => b[0].length - a[0].length);
    for (const [w, k] of words) if (r.includes(w)) {
      (out[g] = out[g] || []).includes(k) || out[g].push(k);
      r = r.split(w).join(" "); rest = rest.split(w).join(" ");
    }
  }
  if (out.type?.includes("sleeveless")) delete out.sleeve;
  if (out.type?.includes("hoodie")) delete out.neck;
  const shades = PAL.filter(c => text.includes(c.name) && !["그린", "블루", "레드", "핑크", "블랙", "화이트", "그레이", "브라운", "베이지", "옐로우", "오렌지", "퍼플", "네이비"].includes(c.name));
  const words = rest.split(/\s+/).filter(w => w.length > 1 && !STOP.includes(w));
  return { attrs: out, shades, words };
}
function judgeColor(p, k, shades) {
  const cs = colsOf(p), tl = (shades.length ? shades.filter(s => s.fam === k) : PAL.filter(c => c.fam === k)).map(c => c.lab);
  const hit = shades.length ? cs.filter(c => shades.some(s => s.name === c.pal || dE00(c.lab, s.lab) <= 10)) : cs.filter(c => c.fam === k);
  const vivid = !["black", "gray", "white"].includes(k);
  const cc = cs.filter(c => !vivid || Math.hypot(c.lab[1], c.lab[2]) >= 10);
  const d = cc.length && tl.length ? Math.min(...cc.flatMap(c => tl.map(l => dE(c.lab, l)))) : 99;
  if (hit.length) return { s: 2, d: 0, hit };
  return d <= 22 ? { s: 1, d } : { s: 0, d };
}
const judge = (p, g, k) => ({ s: has(p, g, k) ? 2 : 0 });
function search(text) {
  const { attrs, shades, words } = parse(text);
  const pool = P.filter(p => visible(p) && (!attrs.type || attrs.type.includes(typeOf(p))));
  const rows = pool.map(p => {
    const gs = [];
    if (attrs.color) gs.push(attrs.color.map(k => ({ g: "color", ...judgeColor(p, k, shades) })).sort((a, b) => b.s - a.s || a.d - b.d)[0]);
    for (const [g, ks] of Object.entries(attrs)) if (g !== "color" && g !== "type") gs.push(ks.map(k => ({ g, ...judge(p, g, k) })).sort((a, b) => b.s - a.s)[0]);
    words.forEach(w => gs.push({ g: "word", s: p.name.toLowerCase().includes(w) ? 2 : 0 }));
    const c = gs.find(j => j.g === "color");
    const score = gs.reduce((a, j) => a + (j.s === 2 ? 1 : j.s === 1 ? 0.4 : 0), 0) + (c ? Math.max(0, 1 - c.d / 40) * 0.5 : 0)
      + Object.entries(attrs).filter(([g]) => g !== "color").reduce((a, [g, ks]) => a + Math.max(...ks.map(k => has(p, g, k))) * 0.3, 0);
    return { p, gs, score };
  });
  return { attrs, shades, words, rows, n: Object.keys(attrs).filter(g => g !== "type").length + words.length };
}

function render() {
  const text = q.value.trim(), el = $("main");
  let groups;   // [{title, items:[{p, shot}]}]
  let note = "";
  if (!text) {
    groups = [{ title: "", items: P.filter(visible).map(p => ({ p })) }];
    note = `<div class="chips">${EXAMPLES.map(x => `<button class="chip" data-ex="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
  } else {
    const r = search(text);
    if (!r.n && !r.attrs.type) { $("pfMain").hidden = true; el.innerHTML = `<div class="empty"><b>검색어를 알아듣지 못했어요</b>색(초록, 카키), 종류(니트, 셔츠), 무늬(스트라이프)로 검색해 보세요.</div>`; return; }
    const tags = Object.entries(r.attrs).flatMap(([g, ks]) => ks.map(k => `${L[g].name}: ${lbl(g, k)}`)).concat(r.shades.map(s => `색: ${s.name}`), r.words);
    note = `<div class="chips">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    const sorted = r.rows.slice().sort((a, b) => b.score - a.score);
    const colorHit = x => x.gs.find(j => j.g === "color")?.hit;
    const full = sorted.filter(x => x.gs.every(j => j.s === 2)), rest = sorted.filter(x => !x.gs.every(j => j.s === 2) && x.score > 0.3).slice(0, 80);
    const mk = x => ({ p: x.p, shot: x.gs.some(j => j.g === "color") ? shotFor(x.p, colorHit(x)) : null });
    groups = [{ title: r.n ? "조건에 맞는 옷" : "", items: full.map(mk) }, { title: full.length ? "비슷한 옷" : "가까운 옷", items: rest.map(mk) }].filter(g => g.items.length);
  }
  const all = groups.flatMap(g => g.items);
  const draw = st => {
    const keep = it => inRange(st, it.p), s = sorter(main.sort);
    let n = 0;
    $("main").querySelector(".res").innerHTML = groups.map(g => {
      const items = g.items.filter(keep).map(it => ({ p: it.p, html: card(it.p, it.shot) }));
      if (s) items.sort(s);
      n += items.length;
      return (g.title ? `<h2 class="sec">${g.title}<small>${items.length}개</small></h2>` : "") + (items.length ? gridHTML(items, main.limit) : "");
    }).join("") || `<div class="empty"><b>맞는 옷이 없어요</b>가격 범위나 필터를 바꿔 보세요.</div>`;
    return n;
  };
  el.innerHTML = `${note}<div class="tool"><span class="sub" id="cnt"></span><span class="sp"></span>
    <select id="sortM" aria-label="정렬"><option value="rec">추천순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></div><div class="res"></div>`;
  $("sortM").value = main.sort;
  $("sortM").onchange = e => { main.sort = e.target.value; main.limit = 48; draw(main); };
  main.limit = 48;
  mountPrice($("pfMain"), all.map(it => price(it.p)), main, st => { const n = draw(st); $("cnt").textContent = `${n}개`; return n; });
  if (!all.length) $("pfMain").hidden = true;
  if (!$("pfMain").innerHTML) { const n = draw(main); $("cnt").textContent = `${n}개`; }
  el._draw = draw;
}
document.addEventListener("click", e => {
  const ex = e.target.closest("[data-ex]");
  if (ex) { q.value = ex.dataset.ex; render(); return; }
  const m = e.target.closest(".more");
  if (m) {
    const inPanel = m.closest("#sheet");
    if (inPanel) { view.limit += 24; drawSimilar(false); } else { main.limit += 48; $("main")._draw(main); }
    return;
  }
  const c = e.target.closest(".card");
  if (c) openItem(P[+c.dataset.i]);
});

// ---------- 상세 ----------
function openItem(p) {
  if (view.p !== p) { view.p = p; view.sel = new Set(); view.sameMall = false; view.otherType = false; view.scope = "same"; view.sort = "sim"; view.limit = 12; view.ref = colsOf(p)[0] || null; }
  drawItem();
  $("sheet").scrollTop = 0;
  $("panel").classList.add("on");
  document.body.style.overflow = "hidden";
}
function closeItem() { $("panel").classList.remove("on"); document.body.style.overflow = ""; }
function drawItem() {
  const p = view.p;
  const sw = p.opts.length ? p.opts.map((o, i) => `<button class="${o === view.ref ? "on" : ""}${o.soldout ? " so" : ""}" data-r="${i}" ${o.lab ? "" : "disabled"}>${o.hex ? `<i class="dot" style="background:${o.hex}"></i>` : ""}${esc(o.name)}</button>`).join("")
    : colsOf(p).map(c => `<button disabled><i class="dot" style="background:${c.hex}"></i>${esc(c.name)}</button>`).join("");
  const sizes = p.sizes && p.sizes.length ? p.sizes.map(s => `<span class="${s.soldout ? "so" : ""}">${esc(s.name)}</span>`).join("") : `<span>옵션 없음</span>`;
  $("sheet").innerHTML = `<button class="x" aria-label="닫기" onclick="closeItem()">✕</button>
    <div class="dt">
      <div class="photo"><img id="hero" alt="${esc(p.name)}"><span class="bd" id="heroBd" hidden></span></div>
      <div><div class="mall">${esc(p.mall)}</div><h2>${esc(p.name)}</h2>
        <div class="price">${won(price(p))}${p.price && p.sale && p.sale < p.price ? `<s>${won(p.price)}</s>` : ""}</div>
        <div class="lab">색상</div><div class="sw" id="sw">${sw}</div>
        <div class="lab">사이즈</div><div class="szs">${sizes}</div>
        <a class="go" href="${esc(p.url)}" target="_blank" rel="noopener">쇼핑몰에서 보기</a></div>
    </div>
    <div class="sim">
      <div class="sim-h"><h3>비슷한 옷 <span class="sub" id="simN"></span></h3><span class="sp"></span>
        <div class="seg" id="scope"><button data-s="same">같은 색</button><button data-s="all">모든 색</button></div>
        <select id="sortS" aria-label="정렬"><option value="sim">비슷한 순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></div>
      <div class="pf" id="pfSim" hidden></div>
      <div class="tch" id="tch"></div>
      <div id="simGrid"></div>
    </div>`;
  $("sortS").value = view.sort;
  setHero();
  drawSimilar(true);
}
// 고른 색의 사진으로 바꾼다(색을 누를 때마다).
function setHero() {
  const p = view.p, s = photoOf(p, view.ref), img = $("hero"), bd = $("heroBd");
  img.classList.add("fade");
  const next = new Image();
  next.onload = () => { img.src = s.img; img.classList.remove("fade"); };
  next.onerror = () => { img.src = s.img; img.classList.remove("fade"); };
  next.src = s.img;
  bd.hidden = !BADGE[s.ev]; bd.textContent = BADGE[s.ev] || "";
}
// 비슷한 옷 후보(가격 필터 전). 같은 종류가 기본, '모든 색'이면 색 무관.
function similarRows() {
  const p = view.p, mine = tagsOf(p), typ = typeOf(p), ref = view.ref;
  return P.filter(x => x !== p && visible(x) && (view.sameMall || x.mall !== p.mall) && (view.otherType || typeOf(x) === typ))
    .filter(x => [...view.sel].every(t => tagsOf(x).includes(t)))
    .map(x => ({ x, sh: tagsOf(x).filter(t => mine.includes(t)), sc: ref ? shared({ _c: [ref] }, x) : [], same: typeOf(x) === typ }))
    .filter(r => view.scope === "all" || r.sc.length)
    .sort((a, b) => b.same - a.same || (b.sc.length > 0) - (a.sc.length > 0) || b.sh.length - a.sh.length);
}
let simPool = [];
// full이 true면 후보와 가격 분포를 다시 만들고, false면(더 보기) 목록만 다시 그린다.
function drawSimilar(full) {
  if (!view.p) return;
  const ref = view.ref;
  if (full) {
    simPool = similarRows();
    $("scope").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.s === view.scope));
    const mine = tagsOf(view.p);
    $("tch").innerHTML = mine.map(t => `<button class="chip${view.sel.has(t) ? " on" : ""}" data-t="${t}">${esc(tagName(t))}</button>`).join("");
  }
  const draw = st => {
    let items = simPool.filter(r => inRange(st, r.x));
    const s = sorter(view.sort);
    if (s) items = items.slice().sort(s);
    $("simN").textContent = `${items.length}개`;
    $("simGrid").innerHTML = items.length ? gridHTML(items.map(r => ({ html: card(r.x, r.sc.length ? shotFor(r.x, [ref]) : null) })), view.limit)
      : `<div class="empty"><b>조건에 맞는 옷이 없어요</b>가격 범위를 넓히거나 '모든 색'을 눌러 보세요.</div>`;
    return items.length;
  };
  if (full) {
    view.lo = view.hi = null;
    mountPrice($("pfSim"), simPool.map(r => price(r.x)), view, st => { view.limit = 12; return draw(st); });
    if ($("pfSim").hidden) draw(view);
  } else draw(view);
}
$("sheet").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.r !== undefined) {
    const o = view.p.opts[+b.dataset.r]; if (!o || !o.lab) return;
    view.ref = o; view.limit = 12;
    $("sw").querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", i === +b.dataset.r));
    setHero(); drawSimilar(true);
  } else if (b.dataset.s) { view.scope = b.dataset.s; view.limit = 12; drawSimilar(true); }
  else if (b.dataset.t) { view.sel.has(b.dataset.t) ? view.sel.delete(b.dataset.t) : view.sel.add(b.dataset.t); view.limit = 12; drawSimilar(true); }
});
$("sheet").addEventListener("change", e => {
  if (e.target.id === "sortS") { view.sort = e.target.value; view.limit = 12; drawSimilar(false); }
});
$("panel").addEventListener("click", e => { if (e.target.id === "panel") closeItem(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeItem(); });
render();
</script>
</body>
