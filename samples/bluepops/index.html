<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블루팝스 BEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f2f4f8;
  --surface: #ffffff;
  --ink: #12203a;
  --muted: #66718a;
  --line: #dce2ee;
  --blue: #2b59ff;
  --blue-ink: #1b3fd1;
  --track: #dde3f1;
  --chip: #eef1f8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0e1626;
    --surface: #152036;
    --ink: #e8edf7;
    --muted: #93a0ba;
    --line: #263450;
    --blue: #7c9bff;
    --blue-ink: #9db4ff;
    --track: #263450;
    --chip: #1d2a45;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 48px 20px 64px; }

header h1 {
  margin: 0;
  font-size: clamp(34px, 6vw, 56px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.035em;
}
header h1 span { color: var(--blue); }
.source { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 32px; margin: 22px 0 0; padding: 0; list-style: none; }
.stats li { display: flex; align-items: baseline; gap: 8px; }
.stats b { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.stats span { color: var(--muted); font-size: 14px; }

.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; margin: 32px 0 12px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 14px; color: var(--ink);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 13px; cursor: pointer;
}
.chip small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.sort { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.sort select {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
}
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.list { margin: 0; padding: 0; list-style: none; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
.row {
  display: grid;
  grid-template-columns: 2.5rem minmax(0, 1.45fr) minmax(0, 1.25fr) minmax(0, 1.2fr);
  grid-template-areas: "rank info price sizes";
  gap: 8px 24px; align-items: center;
  padding: 16px 20px;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.rank { grid-area: rank; font-size: 15px; font-weight: 600; color: var(--muted); }
.info { grid-area: info; min-width: 0; }
.name { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
.tag {
  display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 4px;
  font-size: 12px; font-weight: 500; color: var(--blue-ink); background: color-mix(in srgb, var(--blue) 14%, transparent);
  vertical-align: 1px;
}
.sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

.price { grid-area: price; }
.bar { height: 8px; border-radius: 4px; background: var(--track); }
.bar i {
  display: block; height: 100%; border-radius: 4px; background: var(--blue);
  transform-origin: left center;
}
.intro .bar i { animation: grow .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--n) * 18ms); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.amount { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; margin-top: 8px; }
.amount strong { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.amount s { color: var(--muted); font-size: 13px; }
.amount em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--blue-ink); }

.sizes { grid-area: sizes; display: flex; flex-wrap: wrap; gap: 5px; }
.size {
  display: inline-flex; align-items: baseline; gap: 5px;
  background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 13px;
}
.size b { font-weight: 600; }
.size span { color: var(--muted); font-size: 12px; }
.size.extra { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

.note { margin: 16px 2px 0; color: var(--muted); font-size: 13px; }

@media (max-width: 820px) {
  .wrap { padding-top: 32px; }
  .row {
    grid-template-columns: 1.75rem minmax(0, 1fr);
    grid-template-areas: "rank info" ". price" ". sizes";
    padding: 16px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .intro .bar i { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>블루팝스 <span>BEST</span></h1>
    <p class="source">bluepops.co.kr · 2026-10-25 기준 · 할인가는 사이트에 표시된 쿠폰 적용가</p>
    <ul class="stats" id="stats"></ul>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="종류"></div>
    <label class="sort">정렬
      <select id="sort">
        <option value="rank">BEST 순위</option>
        <option value="low">할인가 낮은 순</option>
        <option value="high">할인가 높은 순</option>
      </select>
    </label>
  </div>

  <ol class="list intro" id="list"></ol>
  <p class="note">사이즈는 선택할 수 있는 옵션만 적었습니다. 사이트가 재고 수량을 공개하지 않아 남은 수량은 알 수 없습니다. 막대는 판매가 길이이고, 파란 부분이 할인가입니다.</p>
</div>

<script>
// [상품번호, 상품명, 판매가, 할인가, 색상, 사이즈, 기장]
const DATA = [

["53276","키드 브이넥 맨투맨 TS10304",34000,25500,"블랙/네이비/그레이/카멜","F(66-110)",""],

["53342","브러쉬 롱 스커트 SK7959",53100,39830,"청록/차콜/퍼플","1(30-33)/2(34-36)",""],

["53301","위트 소프트 티셔츠 TS10306",29700,22280,"그레이/브라운/블랙/아이보리/퍼플","1(66-77)/2(88-100)",""],
["53319","베니 머플러 티셔츠 TS10309",29700,22280,"블랙/아이보리","1(66-77)/2(88-99)",""],
["53371","스프라이프 후드 티셔츠 TS10320",22300,16730,"브라운/아이보리/차콜","F(66-100)",""],
["53348","버드 딥 브이 티셔츠 TS10318",40400,30300,"블랙/차콜","1(66-88)/2(99-120)",""],
["53338","마론 셔링 티셔츠 TS10316",36100,27080,"블랙/크림","1(55-77)/2(88-100)",""],
["53277","하임 맥시 롱 스커트 SK7953",31900,23930,"블랙/소라/크림","1(30-32)/2(33-34)",""],
["53351","퍼드 와이드 팬츠 SL9136",23400,17550,"블랙/그레이/카키/베이지/핑크/화이트/브라운","S(26-27)/M(28-29)/L(30-31)/XL(32-33)/2XL(34-35)","숏/롱"],
["53346","코스트 랩 셔츠 BL9115",48900,36680,"아이보리/소라/차콜","F(66-99)",""],
["53345","블록 와이드 팬츠 SL9134",29700,22280,"블랙/브라운/크림베이지/화이트","S(26-27)/M(28-29)/L(30-31)/XL(32-33)/2XL(34-35)","숏/롱"],
["53341","트리밍 울 가디건 CD7581",31900,23930,"브라운/블루/소라/올리브/와인/핑크","F(55-88)",""],
["53340","커버 언발 랩 원피스 OPS7253",68000,51000,"블랙/차콜","1(66-77)/2(88-100)",""],
["53328","플랜 배색 티셔츠 TS10312",21200,15900,"소라/멜란지/네이비","F(66-88)",""],
["53259","디어 클래식 슬랙스 SL9120",53100,39830,"블랙/차콜","1(30-32)/2(33-34)",""],
["53350","레이 나그랑 티셔츠 TS10319",27600,20700,"퍼플/브라운/차콜/핑크","1(55-77)/2(88-100)",""],
["53337","캔들 체크 스커트 SK7958",23400,17550,"그레이/브라운","F(28-34)",""],
["53322","텐셀 스트라이프 티셔츠 TS10310",35300,26480,"옐로우/브라운/퍼플/아이보리/그레이","F(66-100)",""],
["53317","[오늘출발] 멜로우 V넥 가디건 CD7580 ONLY BLUEPOPS",38900,29180,"블랙/오트밀","1(66-88)/2(99-110)",""],
["52947","플레인 긴팔 티셔츠 TS10264",16900,12680,"멜란지/모카/블랙/아이보리/카키/차콜/인디핑크/아쿠아그린","M(66-77)/L(88-120)",""],
["53347","헤더 와이드 팬츠 SL9135",51000,38250,"블랙/네이비","1(27-32)/2(33-38)",""],
["53335","런던 트렌치 코트 CT0918",95600,71700,"베이지/블랙","F(55-99)",""],
["53334","플릿 레이어드 티셔츠 TS10314",42500,31880,"블랙/차콜","1(55-77)/2(88-100)",""],
["53324","팀버 와이드 데님 팬츠 SL9131",55000,41250,"청/흑청","S(26-27)/M(28-29)/L(30-31)/XL(32-33)/2XL(34-35)/3XL(36-38)",""],
["53321","메이비 밴딩 스커트 SK7955",31900,23930,"블랙/차콜","S(25-26)/M(27-28)/L(29-30)/XL(31-32)/2XL(33-34)",""],
["53318","모니 헨리넥 티셔츠 TS10308",17100,12830,"아이보리/블랙/그레이","F(66-99)",""],
["53280","딥 브이넥 후드 티셔츠 TS10305",34000,25500,"블랙/멜란지/올리브","F(66-99)",""],
["53274","메리 보트넥 랩 티셔츠 TS10303 ONLY BLUEPOPS",35000,26250,"화이트/블랙","1(66-77)/2(88-99)",""],
["53258","너츠 끈 나시 TS10300",19000,14250,"블랙/차콜/브라운/베이지/아이보리","1(66-77)/2(88-100)",""],
["53255","모어 유넥 7부 티셔츠 TS10299",19000,14250,"블랙/멜란지/민트/브라운/아이보리/차콜","1(66-77)/2(88-99)",""],
["53252","뮤트 랩 꼬임 티셔츠 TS10298",31900,23930,"블랙/그레이/브라운","1(66-77)/2(88-100)",""],
["53251","디너 타이 원피스 OPS7252",61600,46200,"블랙/크림","1(66-77)/2(88-99)",""],
["53249","호프 레이어드 티셔츠 TS10297",29500,22130,"그레이/브라운/블랙","1(66-77)/2(88-100)",""],
["53226","보울 랩 스커트 SK7949",48600,36450,"블랙/브라운","1(30-32)/2(33-35)",""]
];

const KIND = { TS: "티셔츠", SK: "스커트", SL: "팬츠", BL: "블라우스·셔츠", CD: "가디건", OPS: "원피스", CT: "코트" };
const won = n => n.toLocaleString("ko-KR") + "원";
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const items = DATA.map((d, i) => {
  const [id, raw, price, sale, colors, sizes, extra] = d;
  let name = raw.replace(/\s*ONLY BLUEPOPS/, "");
  const today = /^\[오늘출발\]\s*/.test(name);
  name = name.replace(/^\[오늘출발\]\s*/, "");
  const m = name.match(/\s+([A-Z]{2,3})(\d{4,5})$/);
  const code = m ? m[1] + m[2] : "";
  const kind = m ? KIND[m[1]] : "기타";
  if (m) name = name.slice(0, m.index);
  return { rank: i + 1, id, name, code, kind, today, price, sale,
    rate: Math.round((1 - sale / price) * 100),
    colors: colors.split("/"), sizes: sizes.split("/"), extra: extra ? extra.split("/") : [] };
});

const maxPrice = Math.max(...items.map(i => i.price));
const state = { kind: "전체", sort: "rank" };

function sizeChip(s) {
  const m = s.match(/^(.+?)\((.+)\)$/);
  return m ? `<span class="size"><b>${esc(m[1])}</b><span>${esc(m[2])}</span></span>`
           : `<span class="size"><b>${esc(s)}</b></span>`;
}

function renderStats() {
  const avg = f => Math.round(items.reduce((a, i) => a + i[f], 0) / items.length / 10) * 10;
  document.getElementById("stats").innerHTML =
    `<li><b>${items.length}개</b><span>BEST 상품</span></li>` +
    `<li><b>${won(avg("price"))}</b><span>평균 판매가</span></li>` +
    `<li><b>${won(avg("sale"))}</b><span>평균 할인가</span></li>`;
}

function renderChips() {
  const kinds = ["전체", ...Object.values(KIND).filter(k => items.some(i => i.kind === k))];
  document.getElementById("chips").innerHTML = kinds.map(k => {
    const n = k === "전체" ? items.length : items.filter(i => i.kind === k).length;
    return `<button class="chip" type="button" data-kind="${k}" aria-pressed="${state.kind === k}">${k}<small>${n}</small></button>`;
  }).join("");
}

function renderList() {
  let list = items.filter(i => state.kind === "전체" || i.kind === state.kind);
  if (state.sort === "low") list = [...list].sort((a, b) => a.sale - b.sale);
  if (state.sort === "high") list = [...list].sort((a, b) => b.sale - a.sale);
  document.getElementById("list").innerHTML = list.map((i, n) => `
    <li class="row" style="--n:${n}">
      <div class="rank">${i.rank}</div>
      <div class="info">
        <h2 class="name">${i.today ? '<span class="tag">오늘출발</span>' : ""}${esc(i.name)}</h2>
        <p class="sub">${esc(i.kind)} · ${esc(i.colors.join(", "))}${i.code ? " · " + esc(i.code) : ""}</p>
      </div>
      <div class="price">
        <div class="bar" style="width:${(i.price / maxPrice * 100).toFixed(1)}%"><i style="width:${(i.sale / i.price * 100).toFixed(1)}%"></i></div>
        <div class="amount"><strong>${won(i.sale)}</strong><s>${won(i.price)}</s><em>${i.rate}%</em></div>
      </div>
      <div class="sizes">${i.sizes.map(sizeChip).join("")}${i.extra.length ? `<span class="size extra">기장 ${esc(i.extra.join("/"))}</span>` : ""}</div>
    </li>`).join("");
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button[data-kind]");
  if (!b) return;
  state.kind = b.dataset.kind;
  document.getElementById("list").classList.remove("intro");
  renderChips(); renderList();
});
document.getElementById("sort").addEventListener("change", e => {
  state.sort = e.target.value;
  document.getElementById("list").classList.remove("intro");
  renderList();
});

renderStats(); renderChips(); renderList();
</script>
</body>
</html>
