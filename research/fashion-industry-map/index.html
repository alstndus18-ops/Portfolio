<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한국 패션 DB · 기업·브랜드·채널</title>
  <style>
    :root{--ink:#1e252d;--muted:#747d87;--line:#dfe4e8;--paper:#f5f6f7;--card:#fff;--navy:#253e63;--blue:#eaf1fb;--orange:#fff0e9;--accent:#db593e}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif} main{max-width:1380px;margin:auto;padding:28px 30px 70px}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:2px solid var(--navy);padding-bottom:16px}h1{font-size:25px;letter-spacing:-.045em;margin:0}.sub{font-size:12px;color:var(--muted);margin:4px 0 0}.date{font-size:12px;color:var(--muted);white-space:nowrap}
    .tools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0 22px}.counts{color:var(--muted);font-size:12px}.counts b{color:var(--navy)}input{width:320px;max-width:100%;border:1px solid #cdd4da;border-radius:6px;padding:9px 11px;font:inherit;background:#fff}
    section{margin-top:27px}h2{font-size:17px;margin:0 0 8px;letter-spacing:-.03em}.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--card)}table{width:100%;min-width:780px;border-collapse:collapse;text-align:left}th{padding:9px 12px;background:#f0f3f5;color:#59636d;font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap}td{padding:10px 12px;border-top:1px solid #edf0f2;vertical-align:top}tr:hover td{background:#fbfcfd}.name{font-weight:750;white-space:nowrap}.muted{color:var(--muted);font-size:12px}
    .chips{display:flex;flex-wrap:wrap;gap:4px}.chip{display:inline-block;border-radius:4px;background:var(--blue);color:#31527d;padding:2px 6px;font-size:11px;line-height:1.45}.chip.channel{background:var(--orange);color:#a44b34}.dash{color:#a5adb5}
    details.more{display:inline}details.more summary{display:inline-block;cursor:pointer;list-style:none;border:1px dashed #b6c6dc;color:#496990;border-radius:4px;padding:1px 5px;font-size:11px}details.more summary::-webkit-details-marker{display:none}details.more[open] summary{display:none}details.more[open] .extra{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:4px}.extra{display:none}
    .brand-table td:nth-child(1){width:22%}.brand-table td:nth-child(2){width:25%}.brand-table td:nth-child(3){width:15%}.channel-table td:nth-child(1){width:30%}.empty{padding:16px;color:var(--muted);font-size:13px}
    @media(max-width:650px){main{padding:20px 14px 45px}header{align-items:start;flex-direction:column;gap:5px}.tools{align-items:stretch;flex-direction:column}.tools input{width:100%}section{margin-top:22px}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>한국 패션 DB</h1><p class="sub">기업 · 브랜드 · 쇼핑 채널 관계 목록</p></div><div class="date">기준일 2026.10.26</div></header>
    <div class="tools"><div id="counts" class="counts"></div><input id="search" type="search" placeholder="기업·브랜드·채널 검색"></div>
    <section><h2>기업별 브랜드 · 쇼핑 채널</h2><div id="companies" class="table-wrap"></div></section>
    <section><h2>브랜드 목록</h2><div id="brands" class="table-wrap"></div></section>
    <section><h2>쇼핑 채널 목록</h2><div id="channels" class="table-wrap"></div></section>
  </main>
  <script>
    const source={entities:'../fashion-commerce-map/data/curated/korea_entities.csv',relations:'../fashion-commerce-map/data/curated/korea_relationships.csv'};
    const $=s=>document.querySelector(s);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function csv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quoted&&next==='"'){cell+='"';i++}else if(ch==='"'){quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}const[heads,...data]=rows;return data.map(vals=>Object.fromEntries(heads.map((head,i)=>[head,vals[i]||''])))}
    function category(raw){if(/unisex/.test(raw))return'유니섹스';if(/women/.test(raw))return'여성복';if(/mens?/.test(raw))return'남성복';if(/kids|infant/.test(raw))return'키즈';if(/golf/.test(raw))return'골프웨어';if(/sports|athleisure/.test(raw))return'스포츠';if(/outdoor/.test(raw))return'아웃도어';if(/footwear|shoes/.test(raw))return'신발';if(/fashion/.test(raw))return'패션';return'기타'}
    function chips(items,kind='',limit=5){if(!items.length)return'<span class="dash">—</span>';const visible=items.slice(0,limit),extra=items.slice(limit);const chip=name=>`<span class="chip ${kind}">${esc(name)}</span>`;return`<div class="chips">${visible.map(chip).join('')}${extra.length?`<details class="more"><summary>+${extra.length}</summary><span class="extra">${extra.map(chip).join('')}</span></details>`:''}</div>`}
    function table(head,body,className=''){return`<table class="${className}"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${head.length}" class="empty">일치하는 항목이 없습니다.</td></tr>`}</tbody></table>`}
    function draw(entities,relations,q=''){
      const byId=Object.fromEntries(entities.map(x=>[x.id,x]));const contains=value=>String(value).toLowerCase().includes(q.toLowerCase());const companies=entities.filter(x=>x.entity_type==='company');const brands=entities.filter(x=>x.entity_type==='brand');const stores=entities.filter(x=>x.entity_type==='storefront');
      const owner={},operator={},brandChannels={};relations.forEach(r=>{const from=byId[r.from_id],to=byId[r.to_id];if(!from||!to)return;if(from.entity_type==='company'&&to.entity_type==='brand'){(owner[to.id]??=[]).push(from.name_ko)}if(from.entity_type==='company'&&to.entity_type==='storefront'){(operator[to.id]??=[]).push(from.name_ko)}if(from.entity_type==='brand'&&to.entity_type==='storefront'){(brandChannels[from.id]??=[]).push(to.name_ko)}});
      $('#counts').innerHTML=`<b>${companies.length}</b> 기업&nbsp;&nbsp;·&nbsp;&nbsp;<b>${brands.length}</b> 브랜드&nbsp;&nbsp;·&nbsp;&nbsp;<b>${stores.length}</b> 쇼핑 채널&nbsp;&nbsp;·&nbsp;&nbsp;<b>${relations.length}</b> 관계`;
      const companyRows=companies.map(company=>{const linked=relations.filter(r=>r.from_id===company.id).map(r=>byId[r.to_id]).filter(Boolean);const ownBrands=[...new Set(linked.filter(x=>x.entity_type==='brand').map(x=>x.name_ko))];const ownStores=[...new Set(linked.filter(x=>x.entity_type==='storefront').map(x=>x.name_ko))];return{company,ownBrands,ownStores}}).filter(x=>(x.ownBrands.length||x.ownStores.length)&&contains(`${x.company.name_ko} ${x.ownBrands} ${x.ownStores}`));
      $('#companies').innerHTML=table(['기업','브랜드','직접 운영 쇼핑 채널'],companyRows.map(x=>`<tr><td class="name">${esc(x.company.name_ko)}</td><td>${chips(x.ownBrands,'brand')}</td><td>${chips(x.ownStores,'channel')}</td></tr>`).join(''));
      const brandRows=brands.filter(x=>contains(`${x.name_ko} ${(owner[x.id]||[]).join(' ')} ${(brandChannels[x.id]||[]).join(' ')}`));$('#brands').innerHTML=table(['브랜드','연결 기업','분류','확인된 직접 채널'],brandRows.map(x=>`<tr><td class="name">${esc(x.name_ko)}</td><td>${chips(owner[x.id]||[])}</td><td class="muted">${category(x.primary_category||'')}</td><td>${chips(brandChannels[x.id]||[],'channel')}</td></tr>`).join(''),'brand-table');
      const channelRows=stores.filter(x=>contains(`${x.name_ko} ${(operator[x.id]||[]).join(' ')}`));const linkedBrand={};relations.forEach(r=>{if(byId[r.from_id]?.entity_type==='brand'&&byId[r.to_id]?.entity_type==='storefront')(linkedBrand[r.to_id]??=[]).push(byId[r.from_id].name_ko)});$('#channels').innerHTML=table(['쇼핑 채널','운영 기업','확인된 직접 연결 브랜드'],channelRows.map(x=>`<tr><td class="name">${esc(x.name_ko)}</td><td>${chips(operator[x.id]||[])}</td><td>${chips(linkedBrand[x.id]||[],'brand')}</td></tr>`).join(''),'channel-table');
    }
    Promise.all([fetch(source.entities).then(r=>r.ok?r.text():Promise.reject()),fetch(source.relations).then(r=>r.ok?r.text():Promise.reject())]).then(([e,r])=>{const entities=csv(e),relations=csv(r);draw(entities,relations);$('#search').addEventListener('input',event=>draw(entities,relations,event.target.value.trim()))}).catch(()=>{$('#companies').innerHTML='<div class="empty">CSV를 읽지 못했습니다.</div>'})
  </script>
</body>
</html>
