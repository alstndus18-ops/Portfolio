<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국내 여성의류 쇼핑몰 리스트</title>
<style>
body{margin:0;background:#f7f4f0;color:#1c1a20;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1160px;margin:auto;padding:42px 22px 80px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:#e65232}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.065em;line-height:1;margin:7px 0 13px}.intro{color:#716d73;max-width:680px}.stats{display:flex;gap:10px;margin:30px 0 16px}.stat{background:#fff;border:1px solid #e7e0d8;border-radius:14px;padding:16px;min-width:135px}.stat b{display:block;font-size:32px;line-height:1}.stat span{font-size:12px;color:#716d73}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{border:1px solid #dcd5cc;border-radius:10px;padding:11px 12px;background:#fff;font:inherit}input{min-width:260px;flex:1}table{width:100%;border-collapse:separate;border-spacing:0 7px}th{text-align:left;color:#716d73;font-size:12px;padding:0 12px}td{background:#fff;padding:14px 12px;border-top:1px solid #e7e0d8;border-bottom:1px solid #e7e0d8}td:first-child{border-left:1px solid #e7e0d8;border-radius:12px 0 0 12px;font-weight:750}td:last-child{border-right:1px solid #e7e0d8;border-radius:0 12px 12px 0}a{color:#3155b7;text-decoration:none;word-break:break-all}.tag{display:inline-block;background:#f1edff;color:#5c4ba9;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700}#empty{color:#716d73;padding:28px;text-align:center}@media(max-width:650px){.wrap{padding:28px 14px}table thead{display:none}table,tbody,tr,td{display:block}tr{margin-bottom:10px}td,td:first-child,td:last-child{border:1px solid #e7e0d8;border-radius:0;padding:9px 12px}td:first-child{border-radius:12px 12px 0 0}td:last-child{border-radius:0 0 12px 12px}.stats{margin-top:22px}}
</style><body><main class="wrap"><div class="eyebrow">WOMENSWEAR RESEARCH LIST · 2026.10.26</div><h1>국내 여성의류<br>쇼핑몰 리스트</h1><p class="intro">원본 쇼핑몰 DB에서 <b>여성의류</b>와 <b>빅사이즈 여성의류</b>만 자동으로 보여줍니다. 이 목록은 후보 풀이며, 운영사·실제 운영 상태·가격대·판매 채널은 개별 검증이 필요합니다.</p><div class="stats"><div class="stat"><b id="total">0</b><span>여성복 후보</span></div><div class="stat"><b id="normal">0</b><span>여성의류</span></div><div class="stat"><b id="plus">0</b><span>빅사이즈 여성의류</span></div></div><div class="bar"><input id="q" type="search" placeholder="이름·키워드 검색"><select id="category"><option value="">전체 여성복</option><option>여성의류</option><option>빅사이즈 여성의류</option></select></div><table><thead><tr><th>쇼핑몰</th><th>분류</th><th>키워드</th><th>URL</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>일치하는 쇼핑몰이 없습니다.</p></main><script>
let data=[];const rows=document.querySelector('#rows'),q=document.querySelector('#q'),category=document.querySelector('#category');function draw(){const x=q.value.toLowerCase(),c=category.value;const out=data.filter(d=>(!c||d.category===c)&&[d.name,d.site_keywords].join(' ').toLowerCase().includes(x));rows.innerHTML=out.map(d=>`<tr><td>${d.name}</td><td><span class="tag">${d.category}</span></td><td>${d.site_keywords||'-'}</td><td><a href="${d.url}" target="_blank" rel="noreferrer">${d.url}</a></td></tr>`).join('');document.querySelector('#empty').hidden=!!out.length}function csv(t){const l=t.trim().split(/\r?\n/),h=l.shift().split(',');return l.map(s=>{let a=[],v='',quote=false;for(let i=0;i<s.length;i++){let z=s[i];if(z==='"')quote=!quote;else if(z===','&&!quote){a.push(v);v=''}else v+=z}a.push(v);return Object.fromEntries(h.map((k,i)=>[k,(a[i]||'').replace(/^"|"$/g,'').replace(/""/g,'"')]))})}fetch('../fashion-commerce-map/data/curated/korea_shopping_malls.csv').then(r=>r.text()).then(t=>{data=csv(t).filter(d=>['여성의류','빅사이즈 여성의류'].includes(d.category));document.querySelector('#total').textContent=data.length;document.querySelector('#normal').textContent=data.filter(d=>d.category==='여성의류').length;document.querySelector('#plus').textContent=data.filter(d=>d.category==='빅사이즈 여성의류').length;draw()});q.oninput=draw;category.onchange=draw;
</script></body></html>
